<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viatge Brussel·les 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-icon { transition: all 0.2s; }
        .btn-icon:active { transform: scale(0.95); }
        
        .cal-icon {
            width: 85px;
            height: 95px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px -1px rgb(0 0 0 / 0.1);
            border: 1px solid #e2e8f0;
        }
        .cal-header {
            background: #ef4444; 
            height: 26px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cal-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 5px;
        }

        .passatger-btn {
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            font-weight: 800;
            text-transform: uppercase;
            color: #475569;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
        .passatger-btn:active { transform: scale(0.98); }
        .passatger-btn::after { content: 'PDF →'; color: #6366f1; font-size: 10px; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900">

    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-xl">
        
        <!-- PANTALLA INICIAL: CALENDARI -->
        <div id="screen-home" class="fade-in flex flex-col flex-grow">
            <header class="bg-indigo-900 text-white p-10 text-center rounded-b-[3rem] shadow-lg">
                <h1 class="text-3xl font-black tracking-tighter uppercase leading-none italic">BRUSSEL·LES</h1>
                <p class="text-indigo-300 font-bold mt-2 uppercase tracking-[0.3em] text-[10px]">Agost 2026</p>
            </header>

            <main class="p-6 flex-grow">
                <div class="grid grid-cols-3 gap-y-8 gap-x-2 mt-4 place-items-center">
                    <!-- Botons del 25 al 31 -->
                    <button onclick="obrirPDF('dia25.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">25</span><span class="text-[8px] font-bold text-slate-400 uppercase">Dt</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia26.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">26</span><span class="text-[8px] font-bold text-slate-400 uppercase">Dc</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia27.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">27</span><span class="text-[8px] font-bold text-slate-400 uppercase">Dj</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia28.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">28</span><span class="text-[8px] font-bold text-slate-400 uppercase">Dv</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia29.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">29</span><span class="text-[8px] font-bold text-slate-400 uppercase">Ds</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia30.pdf')" class="btn-icon flex flex-col items-center">
                        <div class="cal-icon"><div class="cal-header">AGO</div><div class="cal-body"><span class="text-3xl font-black text-slate-700">30</span><span class="text-[8px] font-bold text-slate-400 uppercase">Dg</span></div></div>
                    </button>
                    <button onclick="obrirPDF('dia31.pdf')" class="btn-icon flex flex-col items-center col-start-2">
                        <div class="cal-icon border-indigo-200">
                            <div class="cal-header bg-indigo-600">AGO</div>
                            <div class="cal-body"><span class="text-3xl font-black text-indigo-700">31</span><span class="text-[8px] font-bold text-indigo-400 uppercase">Dl</span></div>
                        </div>
                    </button>
                </div>
            </main>

            <footer class="p-6">
                <button onclick="showScreen('screen-reserves')" class="w-full bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl flex items-center justify-between btn-icon">
                    <div class="text-left">
                        <span class="block font-black text-xl uppercase tracking-tight">Reserves</span>
                        <span class="text-xs text-slate-400 font-bold uppercase tracking-wide">Documents i Tickets</span>
                    </div>
                    <span class="bg-slate-800 p-3 rounded-full text-xl">📂</span>
                </button>
            </footer>
        </div>

        <!-- PANTALLA RESERVES -->
        <div id="screen-reserves" class="hidden fade-in flex flex-col flex-grow">
            <header class="p-6 flex items-center border-b border-slate-200 bg-white sticky top-0 z-10">
                <button onclick="showScreen('screen-home')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">←</button>
                <h2 class="ml-4 font-black text-2xl uppercase tracking-tighter">Reserves</h2>
            </header>

            <main class="p-6 space-y-4">
                <button onclick="showScreen('screen-avions')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">✈️</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Avió</span>
                    <span class="text-slate-300">→</span>
                </button>

                <button onclick="showScreen('screen-bus')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">🚌</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Autobús</span>
                    <span class="text-slate-300">→</span>
                </button>

                <!-- BOTÓ HOTEL QUE PORTA A SUB-PANTALLA -->
                <button onclick="showScreen('screen-hotel')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">🏨</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Hotel</span>
                    <span class="text-slate-300">→</span>
                </button>

                <button onclick="showScreen('screen-tren')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">🚆</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Tren Amsterdam</span>
                    <span class="text-slate-300">→</span>
                </button>

                <button onclick="obrirPDF('museu_vangogh.pdf')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">🌻</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Museu Van Gogh</span>
                    <span class="text-slate-300">→</span>
                </button>

                <button onclick="obrirPDF('casa_anafrank.pdf')" class="w-full bg-white p-5 rounded-3xl flex items-center border border-slate-200 btn-icon shadow-sm">
                    <span class="text-2xl mr-4">🏠</span>
                    <span class="font-bold text-slate-700 uppercase flex-grow text-left">Casa Ana Frank</span>
                    <span class="text-slate-300">→</span>
                </button>
            </main>
        </div>

        <!-- PANTALLA HOTEL (PDF + MAPS) -->
        <div id="screen-hotel" class="hidden fade-in flex flex-col flex-grow">
            <header class="p-6 flex items-center border-b border-slate-200 bg-white">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">←</button>
                <div class="ml-4">
                    <h2 class="font-black text-xl uppercase tracking-tighter leading-none">Hotel</h2>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Reserva i Ubicació</span>
                </div>
            </header>
            <main class="p-6 space-y-6">
                <div class="bg-blue-50 p-8 rounded-[2rem] text-center border-2 border-blue-100">
                    <span class="text-5xl block mb-4">🏨</span>
                    <h3 class="font-black text-slate-800 text-xl uppercase mb-2">Informació de l'Hotel</h3>
                    <p class="text-slate-500 text-sm mb-6">Consulta la reserva o mira la ruta al mapa.</p>
                    
                    <div class="space-y-4">
                        <button onclick="obrirPDF('reserva_hotel.pdf')" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-bold uppercase shadow-lg shadow-indigo-200 btn-icon">
                            📄 Veure Reserva (PDF)
                        </button>
                        
                        <!-- SUBSTITUEIX L'ENLLAÇ PER L'ADREÇA REAL -->
                        <button onclick="window.open('https://www.google.com/maps/dir//MEININGER+Hotel+Bruxelles+City+Center,+Quai+du+Hainaut+33,+1080+Bruxelles,+B%C3%A9lgica/@46.2255909,-1.746586,1223772m/data=!3m2!1e3!4b1!4m8!4m7!1m0!1m5!1m1!1s0x47c3c38bc8f50f41:0x35d52e894dfa5be!2m2!1d4.3382654!2d50.8512504?entry=ttu&g_ep=EgoyMDI2MDgwOS4wIKXMDSoASAFQAw%3D%3D', '_blank')" class="w-full bg-emerald-600 text-white p-5 rounded-2xl font-bold uppercase shadow-lg shadow-emerald-200 btn-icon">
                            📍 Com anar-hi (Maps)
                        </button>
                    </div>
                </div>
            </main>
        </div>

        <!-- PANTALLES PASSATGERS (AVIÓ, BUS, TREN) -->
        <div id="screen-avions" class="hidden fade-in flex flex-col flex-grow">
            <header class="p-6 flex items-center border-b border-slate-200 bg-white">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">←</button>
                <div class="ml-4"><h2 class="font-black text-xl uppercase tracking-tighter leading-none">Avió</h2><span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Cartes d'embarcament</span></div>
            </header>
            <main class="p-6 space-y-3">
                <button onclick="obrirPDF('vol_savina.pdf')" class="passatger-btn">Savina</button>
                <button onclick="obrirPDF('vol_clara.pdf')" class="passatger-btn">Clara</button>
                <button onclick="obrirPDF('vol_oliver.pdf')" class="passatger-btn">Òliver</button>
                <button onclick="obrirPDF('vol_anna.pdf')" class="passatger-btn">Anna</button>
                <button onclick="obrirPDF('vol_pep.pdf')" class="passatger-btn">Pep</button>
            </main>
        </div>

        <div id="screen-bus" class="hidden fade-in flex flex-col flex-grow">
            <header class="p-6 flex items-center border-b border-slate-200 bg-white">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">←</button>
                <div class="ml-4"><h2 class="font-black text-xl uppercase tracking-tighter leading-none">Autobús</h2><span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Tickets de grup</span></div>
            </header>
            <main class="p-6 space-y-3">
                <button onclick="obrirPDF('bus_savina.pdf')" class="passatger-btn">Savina</button>
                <button onclick="obrirPDF('bus_clara.pdf')" class="passatger-btn">Clara</button>
                <button onclick="obrirPDF('bus_oliver.pdf')" class="passatger-btn">Òliver</button>
                <button onclick="obrirPDF('bus_anna.pdf')" class="passatger-btn">Anna</button>
                <button onclick="obrirPDF('bus_pep.pdf')" class="passatger-btn">Pep</button>
            </main>
        </div>

        <div id="screen-tren" class="hidden fade-in flex flex-col flex-grow">
            <header class="p-6 flex items-center border-b border-slate-200 bg-white">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">←</button>
                <div class="ml-4"><h2 class="font-black text-xl uppercase tracking-tighter leading-none">Tren</h2><span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Bitllets Amsterdam</span></div>
            </header>
            <main class="p-6 space-y-3">
                <button onclick="obrirPDF('tren_savina.pdf')" class="passatger-btn">Savina</button>
                <button onclick="obrirPDF('tren_clara.pdf')" class="passatger-btn">Clara</button>
                <button onclick="obrirPDF('tren_oliver.pdf')" class="passatger-btn">Òliver</button>
                <button onclick="obrirPDF('tren_anna.pdf')" class="passatger-btn">Anna</button>
                <button onclick="obrirPDF('tren_pep.pdf')" class="passatger-btn">Pep</button>
            </main>
        </div>

        <footer class="text-center py-6 mt-auto">
            <target="_blank" class="text-[10px] text-slate-300 font-bold uppercase tracking-widest italic">By Família Serra-Casals</a>
        </footer>
    </div>

    <script>
        function showScreen(screenId) {
            const screens = ['screen-home', 'screen-reserves', 'screen-avions', 'screen-bus', 'screen-tren', 'screen-hotel'];
            screens.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function obrirPDF(fitxer) {
            window.open(fitxer, '_blank');
        }
    </script>
</body>
</html>
