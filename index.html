<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viatge Brussel·les 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-icon { transition: all 0.2s; }
        .btn-icon:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="max-w-md mx-auto min-h-screen flex flex-col shadow-2xl bg-white">
        
        <!-- PANTALLA INICIAL: CALENDARI -->
        <div id="screen-home" class="fade-in flex flex-col h-full flex-grow">
            <header class="bg-blue-700 text-white p-8 text-center rounded-b-[3rem] shadow-lg">
                <h1 class="text-3xl font-black tracking-tight uppercase">Brussel·les</h1>
                <p class="text-blue-100 font-bold mt-1 uppercase tracking-widest text-xs">25 - 31 d'Agost 2026</p>
            </header>

            <main class="p-6 flex-grow">
                <h2 class="text-center text-slate-400 font-black uppercase text-[10px] tracking-[0.2em] mb-6">Itinerari del viatge</h2>
                
                <!-- GRID DE DIES -->
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="obrirPDF('dia25.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🇧🇪</span>
                        <span class="font-black text-xl text-blue-700">25</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Dimarts</span>
                    </button>
                    <button onclick="obrirPDF('dia26.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🍫</span>
                        <span class="font-black text-xl text-blue-700">26</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Dimecres</span>
                    </button>
                    <button onclick="obrirPDF('dia27.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🍟</span>
                        <span class="font-black text-xl text-blue-700">27</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Dijous</span>
                    </button>
                    <button onclick="obrirPDF('dia28.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🏛️</span>
                        <span class="font-black text-xl text-blue-700">28</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Divendres</span>
                    </button>
                    <button onclick="obrirPDF('dia29.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🇳🇱</span>
                        <span class="font-black text-xl text-blue-700">29</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Dissabte</span>
                    </button>
                    <button onclick="obrirPDF('dia30.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center">
                        <span class="text-3xl mb-1">🎨</span>
                        <span class="font-black text-xl text-blue-700">30</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Diumenge</span>
                    </button>
                    <button onclick="obrirPDF('dia31.pdf')" class="btn-icon bg-white border-2 border-slate-100 p-5 rounded-3xl shadow-sm flex flex-col items-center col-span-2">
                        <span class="text-3xl mb-1">✈️</span>
                        <span class="font-black text-xl text-blue-700">31 d'Agost</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Tornada</span>
                    </button>
                </div>
            </main>

            <footer class="p-6">
                <button onclick="showScreen('screen-reserves')" class="w-full bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl flex items-center justify-between btn-icon">
                    <div class="text-left">
                        <span class="block font-black text-xl uppercase tracking-tight">Reserves</span>
                        <span class="text-xs text-slate-400 font-bold uppercase">Tickets i Confirmacions</span>
                    </div>
                    <span class="text-3xl">📂</span>
                </button>
            </footer>
        </div>

        <!-- PANTALLA RESERVES -->
        <div id="screen-reserves" class="hidden fade-in flex flex-col h-full flex-grow">
            <header class="p-6 flex items-center border-b border-slate-100">
                <button onclick="showScreen('screen-home')" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-xl">←</button>
                <h2 class="ml-4 font-black text-2xl uppercase tracking-tighter">Reserves</h2>
            </header>

            <main class="p-6 space-y-4 flex-grow">
                <button onclick="showScreen('screen-avions')" class="w-full bg-blue-50 p-6 rounded-3xl flex items-center border-2 border-blue-100 btn-icon">
                    <span class="text-3xl mr-4">✈️</span>
                    <div class="text-left">
                        <span class="block font-black text-lg text-blue-900 uppercase">Avió</span>
                        <span class="text-xs text-blue-400 font-bold uppercase">Cartes d'embarcament</span>
                    </div>
                </button>

                <button onclick="showScreen('screen-bus')" class="w-full bg-emerald-50 p-6 rounded-3xl flex items-center border-2 border-emerald-100 btn-icon">
                    <span class="text-3xl mr-4">🚌</span>
                    <div class="text-left">
                        <span class="block font-black text-lg text-emerald-900 uppercase">Autobús</span>
                        <span class="text-xs text-emerald-400 font-bold uppercase">Tickets de grup</span>
                    </div>
                </button>

                <button onclick="obrirPDF('tren_amsterdam.pdf')" class="w-full bg-orange-50 p-6 rounded-3xl flex items-center border-2 border-orange-100 btn-icon">
                    <span class="text-3xl mr-4">🚆</span>
                    <div class="text-left">
                        <span class="block font-black text-lg text-orange-900 uppercase">Tren Amsterdam</span>
                        <span class="text-xs text-orange-400 font-bold uppercase">Anada i tornada</span>
                    </div>
                </button>

                <button onclick="obrirPDF('museu_vangogh.pdf')" class="w-full bg-yellow-50 p-6 rounded-3xl flex items-center border-2 border-yellow-100 btn-icon">
                    <span class="text-3xl mr-4">🌻</span>
                    <div class="text-left">
                        <span class="block font-black text-lg text-yellow-900 uppercase">Museu Van Gogh</span>
                        <span class="text-xs text-yellow-500 font-bold uppercase">Entrada confirmada</span>
                    </div>
                </button>

                <button onclick="obrirPDF('casa_anafrank.pdf')" class="w-full bg-red-50 p-6 rounded-3xl flex items-center border-2 border-red-100 btn-icon">
                    <span class="text-3xl mr-4">🏠</span>
                    <div class="text-left">
                        <span class="block font-black text-lg text-red-900 uppercase">Casa Ana Frank</span>
                        <span class="text-xs text-red-400 font-bold uppercase">Entrada reservada</span>
                    </div>
                </button>
            </main>
        </div>

        <!-- PANTALLA PASSATGERS (SUB-MENÚ AVIÓ) -->
        <div id="screen-avions" class="hidden fade-in flex flex-col h-full flex-grow">
            <header class="p-6 flex items-center border-b border-slate-100">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-xl">←</button>
                <div class="ml-4">
                    <h2 class="font-black text-xl uppercase tracking-tighter leading-none">Embarcament Avió</h2>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tria passatger</span>
                </div>
            </header>

            <main class="p-6 grid grid-cols-1 gap-3">
                <button onclick="obrirPDF('vol_savina.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Savina</span>
                    <span class="text-blue-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('vol_clara.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Clara</span>
                    <span class="text-blue-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('vol_oliver.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Òliver</span>
                    <span class="text-blue-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('vol_anna.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Anna</span>
                    <span class="text-blue-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('vol_pep.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Pep</span>
                    <span class="text-blue-500 font-black">PDF →</span>
                </button>
            </main>
        </div>

        <!-- PANTALLA PASSATGERS (SUB-MENÚ BUS) -->
        <div id="screen-bus" class="hidden fade-in flex flex-col h-full flex-grow">
            <header class="p-6 flex items-center border-b border-slate-100">
                <button onclick="showScreen('screen-reserves')" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-xl">←</button>
                <div class="ml-4">
                    <h2 class="font-black text-xl uppercase tracking-tighter leading-none">Tickets Autobús</h2>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tria passatger</span>
                </div>
            </header>

            <main class="p-6 grid grid-cols-1 gap-3">
                <button onclick="obrirPDF('bus_savina.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Savina</span>
                    <span class="text-emerald-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('bus_clara.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Clara</span>
                    <span class="text-emerald-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('bus_oliver.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Òliver</span>
                    <span class="text-emerald-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('bus_anna.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Anna</span>
                    <span class="text-emerald-500 font-black">PDF →</span>
                </button>
                <button onclick="obrirPDF('bus_pep.pdf')" class="bg-white border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center btn-icon">
                    <span class="font-bold text-slate-700 uppercase">Pep</span>
                    <span class="text-emerald-500 font-black">PDF →</span>
                </button>
            </main>
        </div>

        <!-- SIGNATURA -->
        <footer class="text-center py-4 bg-white border-t border-slate-50">
            <a href="https://neurekalab.com" target="_blank" class="text-[10px] text-slate-300 font-bold uppercase tracking-widest italic">By NeurekaLAB</a>
        </footer>
    </div>

    <script>
        function showScreen(screenId) {
            // Amagar totes les pantalles
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-reserves').classList.add('hidden');
            document.getElementById('screen-avions').classList.add('hidden');
            document.getElementById('screen-bus').classList.add('hidden');

            // Mostrar la seleccionada
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function obrirPDF(fitxer) {
            // Funció per obrir el PDF que està a la mateixa carpeta de GitHub
            // Si el fitxer no existeix a GitHub, donarà un error 404
            window.open(fitxer, '_blank');
        }
    </script>
</body>
</html>
